<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtView</title>
    <script type="module" crossorigin src="/mod-4-project/assets/index-Hez1pAdP.js"></script>
    <link rel="stylesheet" crossorigin href="/mod-4-project/assets/index-B_zs-Ylr.css">
  </head>
  <body>

    <main id="app">

      <h1>Artview 🔍</h1>
      <section class="form-container">
        <h2>Search for artworks:</h2>
        
        <form aria-label="Search for artworks by keyword" action="#" method="POST">
          <div class="form-group">
            <label for="artSearch">keyword:</label>
            <input type="text" id="artSearch" name="artSearch" required/>
          </div>
          <button type="submit" id="submit">search</button>
          <!-- <button
          type="filter"
          id="filter">Fliter</button> -->
        </form>
      </section>
      
      <div class="main-layout">
        
        <section class="favorites-container">
          <h2>Favorites ★</h2>
          <ul id="favorites-list">
            <!-- <li class="card">
              <p id="title"></p>
              <img src="" alt="" id="image" />
            </li> -->
        </ul>
        </section>

      <section class="container">
        <h2>Artworks</h2>
        <ul id="art-list">
          <!-- <li class="card">
            <p id="title"></p>
            <img src="" alt="" id="image" />
          </li> -->
        </ul>
      </section>

      </div>

      <div id="overlay" class="hidden">
      <section id="single-card">
        <h2>Details</h2>
        <p id="single-title"></p>
        <img id="single-image" src="" alt="" />
        <p id="single-artist"></p>
        <p id="single-date"></p>
        <p id="single-description"></p>
        <button id="close-btn">X</button>
      </section>
      </div>

    </main>
  </body>
</html>
