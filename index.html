<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtView</title>
  </head>
  <body>
    <h1>Artview</h1>
    
    <main id="app">

      <section class="form-container">
        <h2>Search for art</h2>
        <form action="#" method="POST">
          <div class="form-group">
            <label for="artSearch">Art Title</label>
            <input type="text" id="artSearch" name="artSearch" required />
          </div>
          <button type="submit" id="submit">Submit</button>
        </form>
      </section>

      <section class="container">
        <div class="card">
          <p id="title"></p>
          <img src="" alt="" id="image" />
        </div>
      </section>

      
      <section id="single-card">
        <h1 id="single-title"></h1>
        <h2 id="single-artist"></h2>
        <img
          id="single-image"
          src=""
          alt=""
        />
        <div id="single-info">
          <p id="single-date"></p>
          <p id="single-description"></p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
